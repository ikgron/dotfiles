"$schema" = "https://starship.rs/config-schema.json"

[username]
style_user = "blue bold"
style_root = "red bold"
format = "[$user]($style) "
disabled = false
show_always = true

[hostname]
ssh_symbol = " "
ssh_only = false
format = "@ [$hostname](bold blue) "
trim_at = "."
disabled = false

[directory]
read_only = " "
truncate_to_repo = true
style = "bold italic green"

[character]
success_symbol = '\$'
error_symbol = '[\$](red)'

[git_branch]
symbol = " "
format = "[$symbol$branch]($style) "

